<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sarah May Hui Yu Lammert{% endblock %}</title>
    <meta name="description" content="{% block description %}Sarah May Hui Yu Lammert: projects, photos and book notes.{% endblock %}">

    <!-- link previews on social media and in messages -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sarah May Hui Yu Lammert">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='social-card.jpg') }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Sarah May Hui Yu Lammert's name beside a photo of a squirrel eating a nut">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="theme-color" content="{% block theme_color %}#f5f0e7{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="{% block body_class %}{% endblock %}">
    {% if request.endpoint not in ('home', 'project', 'book', 'reading_log_page') %}
    <nav class="site-nav">
        <a href="{{ url_for('home') }}">Back</a>
    </nav>
    {% endif %}

    {% block content %}{% endblock %}
</body>

</html>
